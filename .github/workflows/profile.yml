name: Build profile

# Rebuilds README.md and assets/ from live GitHub data. Does NOT touch the
# `output` branch — that belongs to snake.yml.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "generators/**"
      - "data/**"
      - ".github/workflows/profile.yml"

# One build at a time. Never cancel an in-flight run — we don't want a commit
# racing another commit against the same README.
concurrency:
  group: profile-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: pip install --upgrade pip PyYAML pytest

      - name: Run tests (unit + live discovery smoke)
        env:
          # Passed so the live smoke test in tests/test_live_smoke.py runs
          # against the real API — the whole point is to catch endpoint /
          # scope regressions like the /user/repos → /users/{owner}/repos
          # fix before the build step.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m pytest -q

      - name: Build profile
        env:
          # Repo discovery: deliberately GITHUB_TOKEN only — no PAT fallback.
          # This build is public-repos-only by design: what shows up on my
          # profile should be exactly what any anonymous visitor can already
          # see. Introducing a PAT here would silently widen what the build
          # can read (private repos, other users' .profile.yml) without a
          # corresponding change to the visible output, which is a footgun.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Contributions panel: a classic PAT with `read:user` scope ONLY,
          # used solely for the contributionsCollection GraphQL call. It must
          # NOT have `repo` scope — the point of splitting it out is so this
          # token cannot read private repo contents. Private contributions
          # come back as anonymised counts under read:user, which is exactly
          # what we want (totals, no private repo names). If the secret is
          # absent the build skips the panel rather than failing, so a fork
          # can run this workflow without needing to configure it.
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: python -m generators.build

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name "profile-bot"
          git config user.email "profile-bot@users.noreply.github.com"
          if [ -z "$(git status --porcelain README.md assets/)" ]; then
            echo "no changes to commit"
            exit 0
          fi
          git add README.md assets/
          git commit -m "chore(profile): rebuild from live GitHub data"
          # Never push anywhere except main. Snake owns `output`.
          git push origin main
