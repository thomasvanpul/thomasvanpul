name: Build profile

# Rebuilds README.md and assets/ from live GitHub data. Does NOT touch the
# `output` branch — that belongs to snake.yml.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "generators/**"
      - "data/**"
      - ".github/workflows/profile.yml"

# One build at a time. Never cancel an in-flight run — we don't want a commit
# racing another commit against the same README.
concurrency:
  group: profile-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: pip install --upgrade pip PyYAML pytest

      - name: Run tests (unit + live API smoke)
        env:
          # Passed so the live smoke tests in tests/test_live_smoke.py run
          # against the real API — the whole point is to catch endpoint /
          # scope regressions (e.g. the earlier /user/repos → /users/{owner}/repos
          # fix, or a viewer → user(login:) regression on the contributions
          # query) before the build step.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m pytest -q

      - name: Build profile
        env:
          # Both repo discovery and the contributions panel now run against
          # GITHUB_TOKEN. Discovery uses /users/{owner}/repos (public,
          # installation-token-friendly) and the contributions GraphQL call
          # targets user(login:) rather than viewer, so both work with the
          # installation token. The earlier PROFILE_STATS_TOKEN classic PAT
          # is no longer needed and has been removed from the workflow.
          # Rationale: the fewer credentials this build depends on, the
          # fewer credentials can fail or expire without notice.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m generators.build

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name "profile-bot"
          git config user.email "profile-bot@users.noreply.github.com"
          if [ -z "$(git status --porcelain README.md assets/)" ]; then
            echo "no changes to commit"
            exit 0
          fi
          git add README.md assets/
          git commit -m "chore(profile): rebuild from live GitHub data"
          # Never push anywhere except main. Snake owns `output`.
          git push origin main
