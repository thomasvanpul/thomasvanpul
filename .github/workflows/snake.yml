name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # The five dot colours are the one place on this page where hue is
          # allowed to mean something: index 0 is a day with no contributions and
          # the rest run low to high, so colour is carrying a measured count. That
          # is Atrium's density ramp exactly, so the ramp is what it gets --
          # density-0 to density-4 from data/atrium-tokens.json, with the snake
          # itself on density-5, the same ink generators/svg draws with. Dark runs
          # the ramp forwards and light runs it backwards, so in both themes a
          # busier day is further from the ground it sits on.
          # Filenames are unchanged -- the query string is not part of them --
          # so generators/content.py needs no edit.
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#080302&color_dots=#f6eaec,#e84552,#b81d14,#78140f,#450d0a
            dist/github-contribution-grid-snake-dark.svg?color_snake=#f6eaec&color_dots=#080302,#450d0a,#78140f,#b81d14,#e84552

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
